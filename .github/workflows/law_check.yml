name: Daily Law Update Check

on:
  schedule:
    - cron: "0 22 * * *"   # 每天 UTC 22:00（台灣 06:00）查法規更新
  workflow_dispatch:
  push:
    paths:
      - 'data/lawcheck_trigger'   # 改此檔即手動觸發一次

jobs:
  law-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write          # 有更新時開 Issue → GitHub 寄信通知
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install "pinecone>=5.0.0" "google-auth>=2.23.0" "requests>=2.31.0"
      - name: Check law updates
        env:
          PINECONE_API_KEY:            ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME:         ah-biao-bot
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MAIL_USER:                   ${{ secrets.MAIL_USER }}
          MAIL_PASS:                   ${{ secrets.MAIL_PASS }}
          MAIL_TO:                     ${{ secrets.MAIL_TO }}
          GH_TOKEN:                    ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:                     ${{ github.repository }}
          LAW_TEST:                    "1"
        run: python scripts/law_check.py
