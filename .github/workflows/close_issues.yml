name: Close Test Issues (one-off)

on:
  push:
    paths:
      - 'data/close_trigger'

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close issues #1 #2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in 1 2; do
            curl -s -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$n" \
              -d '{"state":"closed"}' -o /dev/null -w "issue #$n -> %{http_code}\n"
          done
