name: Daily Knowledge Base Sync

on:
  schedule:
    - cron: "0 19 * * *"   # 每天 UTC 19:00（台灣時間隔日 03:00）
  workflow_dispatch:
  push:
    paths:
      - 'data/reindex_trigger'   # 改動此檔即可手動觸發重建（免 API 權杖）

concurrency:
  group: kb-sync          # 同時間只跑一個同步，避免併發互搶
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OCR + .doc tools (tesseract, poppler, libreoffice)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-tra poppler-utils libreoffice-writer

      - name: Install dependencies
        run: |
          pip install \
            google-auth>=2.23.0 \
            google-api-python-client>=2.108.0 \
            pypdf>=3.17.0 \
            python-docx>=1.1.0 \
            openpyxl>=3.1.0 \
            pinecone>=5.0.0 \
            fastembed>=0.4.0 \
            pytesseract>=0.3.10 \
            pdf2image>=1.16.0

      - name: Build / sync index
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PINECONE_API_KEY:            ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME:         ah-biao-bot
        run: python scripts/build_index.py

      - name: Save checkpoint (commit processed file list)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/checkpoint.json
          if git diff --staged --quiet; then
            echo "No new files processed."
          else
            git commit -m "chore: update index checkpoint [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            # 重建期間 remote 可能已有新 commit → 先 rebase 再 push，避免衝突失敗
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              echo "push 衝突，重試 $attempt ..."
              sleep 5
            done
          fi
