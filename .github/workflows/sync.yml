name: Daily Knowledge Base Sync

on:
  schedule:
    - cron: "0 1 * * *"   # 每天 UTC 01:00 (台灣時間 09:00)
  workflow_dispatch:        # 允許手動觸發

jobs:
  build-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build knowledge base index
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python scripts/build_index.py

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/knowledge_base.json
          if git diff --staged --quiet; then
            echo "No changes to knowledge base."
          else
            git commit -m "chore: update knowledge base index [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
